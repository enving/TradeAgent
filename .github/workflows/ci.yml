name: TradeAgent CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHON_DOTENV_DISABLED: "1"
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Install dev dependencies if they are not in requirements.txt (but they seem to be there)
        pip install pytest pytest-asyncio pytest-socket ruff

    - name: Lint with Ruff
      run: |
        # Run ruff for linting
        ruff check .
      continue-on-error: true # Don't fail the build just for linting yet, let the user decide strictness later

    - name: Run Unit Tests (Safe)
      run: |
        # Manual and E2E scripts can call external services or update parameters.
        # Unix sockets are needed by asyncio; network sockets remain disabled.
        python -m pytest tests/ \
          --ignore=tests/test_integration.py \
          --ignore=tests/test_adaptive_optimizer_e2e.py \
          --ignore-glob='tests/test_*_manual.py' \
          --disable-socket --allow-unix-socket -v
