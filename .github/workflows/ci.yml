name: TradeAgent CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tradeagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Initialize Database
      run: |
        # Initialize the test database schema
        # We need to set the POSTGRES_URL for the script to use the service container
        export POSTGRES_URL=postgresql+asyncpg://postgres:password@localhost:5432/tradeagent_test
        python scripts/setup_db.py

    - name: Lint with Ruff
      run: |
        # Run ruff for linting
        ruff check .
      continue-on-error: true

    - name: Run Unit Tests (Safe)
      env:
        POSTGRES_URL: postgresql+asyncpg://postgres:password@localhost:5432/tradeagent_test
      run: |
        pytest tests/ --ignore=tests/test_integration.py -v

    - name: Run Integration Tests (With Secrets)
      if: ${{ env.ALPACA_API_KEY != '' }}
      env:
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
        IONOS_API_KEY: ${{ secrets.IONOS_API_KEY }}
        IONOS_API_URL: ${{ secrets.IONOS_API_URL }}
        IONOS_MODEL: ${{ secrets.IONOS_MODEL }}
        POSTGRES_URL: postgresql+asyncpg://postgres:password@localhost:5432/tradeagent_test
        ENVIRONMENT: ${{ vars.ENVIRONMENT }}
        LOG_LEVEL: ${{ vars.LOG_LEVEL }}
        PYTHONPATH: .
      run: |
        echo "Secrets detected. Running integration tests..."
        # Run the script-based integration test
        python scripts/testing/test_integration.py
        
        # Also run the pytest integration test if it's different
        pytest tests/test_integration.py -v
