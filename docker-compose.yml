# Docker Compose for TradeAgent
# Run with: docker-compose up -d

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tradeagent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trade_agent
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  tradeagent:
    build: .
    container_name: tradeagent_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

    # DNS servers (bypass Pi-hole)
    dns:
      - 8.8.8.8
      - 8.8.4.4

    # Environment variables from .env file
    env_file:
      - .env

    # Mount logs directory for persistence
    volumes:
      - ./logs:/app/logs

    # Run the event-driven service (scheduler + real-time + RSS)
    command: python -m src.event_driven_service

    # Resource limits (optional - adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  postgres_data:

