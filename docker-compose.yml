# Docker Compose for TradeAgent
# Run with: docker-compose up -d

version: '3.8'

services:
  tradeagent:
    build: .
    container_name: tradeagent-bot
    restart: unless-stopped

    # DNS servers (bypass Pi-hole)
    dns:
      - 8.8.8.8
      - 8.8.4.4

    # Environment variables from .env file
    env_file:
      - .env

    # Mount logs directory for persistence
    volumes:
      - ./logs:/app/logs

    # Run the internal scheduler service
    command: python -m src.scheduler_service

    # Resource limits (optional - adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

